name: examen-cadena-frio-mysql

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-cadena-frio
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_cadena_frio_data:/var/lib/mysql
      - ./sql/02_asignar_permisos.sql:/docker-entrypoint-initdb.d/02_asignar_permisos.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_cadena_frio_data:

